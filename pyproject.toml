[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "corporate-rag-ingestion"
version = "0.1.0"
description = "Reliable ingestion foundation for a corporate knowledge base"
requires-python = ">=3.11"
dependencies = [
  "docling>=2.118,<3",
  "httpx>=0.27,<1",
  "openpyxl>=3.1,<4",
  "pillow>=10,<13",
  "portalocker>=2.7,<4",
  "pymupdf>=1.24,<2",
  "pydantic>=2.7,<3",
  "pydantic-settings>=2.3,<3",
  "sqlalchemy>=2.0,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]
postgres = ["psycopg[binary]>=3.1,<4"]
retrieval = [
  "fastembed>=0.8,<0.9",
  "qdrant-client>=1.19,<2",
  "sentence-transformers>=5.7,<6",
]
ui = ["streamlit>=1.61,<2"]
api = [
  "fastapi>=0.116,<1",
  "psutil>=6,<8",
  "uvicorn[standard]>=0.35,<1",
]
monkeyocr-runtime = [
  "transformers==4.57.6",
  "accelerate==1.10.1",
  "einops==0.8.1",
]

[project.scripts]
rag-ingest = "corporate_rag_ingestion.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
